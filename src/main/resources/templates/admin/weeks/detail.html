<!DOCTYPE html>

<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="'Semana ' + ${week.number}">
        Semana
    </title>

    <link rel="stylesheet"
          th:href="@{/css/app.css}">


</head>

<body class="min-h-screen bg-slate-100 text-slate-900">

<div class="mx-auto max-w-7xl px-6 py-10">

    <!-- ==========================================
         NAVEGACIÓN
    =========================================== -->

    <div class="mb-8">

        <a th:href="@{/admin}"
           class="inline-flex items-center gap-2
              text-sm font-semibold
              text-slate-500
              hover:text-sky-600">

            ← Volver al panel

        </a>

    </div>


    <!-- ==========================================
         HEADER DE SEMANA
    =========================================== -->

    <section class="mb-10 rounded-2xl
                border border-slate-200
                bg-white p-6
                shadow-sm">


        <div class="flex flex-col gap-6
                md:flex-row
                md:items-start
                md:justify-between">


            <div class="flex gap-5">


                <!-- NÚMERO -->

                <div class="flex h-20 w-20
                        shrink-0
                        items-center
                        justify-center
                        rounded-2xl
                        bg-sky-600
                        text-3xl
                        font-bold
                        text-white">

                <span th:text="${week.number}">
                    01
                </span>

                </div>


                <!-- INFORMACIÓN -->

                <div>

                    <p class="text-sm font-semibold
                          uppercase tracking-wider
                          text-sky-600">

                        Semana

                    </p>


                    <h1 class="mt-1 text-3xl
                           font-bold">

                    <span th:text="${week.title}">
                        Título
                    </span>

                    </h1>


                    <p th:if="${week.description != null
                           and !week.description.isBlank()}"
                       th:text="${week.description}"
                       class="mt-2 max-w-2xl
                          text-slate-500">

                        Descripción

                    </p>

                </div>

            </div>


            <!-- EDITAR -->

            <a th:href="@{/admin/weeks/edit/{id}(id=${week.id})}"
               class="inline-flex items-center
                  justify-center gap-2
                  rounded-lg
                  border border-slate-300
                  bg-white
                  px-4 py-2.5
                  text-sm font-semibold
                  text-slate-700
                  hover:bg-slate-50">

                ✏ Editar semana

            </a>

        </div>

    </section>


    <!-- ==========================================
         TRABAJOS
    =========================================== -->

    <section>


        <div class="mb-6 flex flex-col gap-4
                sm:flex-row
                sm:items-center
                sm:justify-between">


            <div>

                <h2 class="text-2xl font-bold">

                    Trabajos

                </h2>

                <p class="mt-1 text-sm
                      text-slate-500">

                    Trabajos asociados a esta semana.

                </p>

            </div>


            <!-- NUEVO TRABAJO -->

            <a th:href="@{/admin/works/new/{weekId}(weekId=${week.id})}"
               class="inline-flex items-center
                  justify-center
                  rounded-lg
                  bg-sky-600
                  px-4 py-2.5
                  text-sm font-semibold
                  text-white
                  hover:bg-sky-700">

                + Nuevo trabajo

            </a>

        </div>


        <!-- ==========================================
             CARDS
        =========================================== -->

        <div class="grid gap-6
                sm:grid-cols-2
                lg:grid-cols-3">


            <article th:each="work : ${week.works}"
                     class="overflow-hidden
                        rounded-2xl
                        border border-slate-200
                        bg-white
                        shadow-sm
                        transition
                        hover:-translate-y-1
                        hover:shadow-lg">


                <!-- IMAGEN -->

                <div class="h-44 bg-slate-100">

                    <img th:if="${work.imageUrl != null
                             and !work.imageUrl.isBlank()}"
                         th:src="${work.imageUrl}"
                         th:alt="${work.title}"
                         class="h-full w-full
                            object-cover">


                    <div th:unless="${work.imageUrl != null
                                 and !work.imageUrl.isBlank()}"
                         class="flex h-full
                            items-center
                            justify-center
                            text-slate-400">

                        Sin imagen

                    </div>

                </div>


                <!-- CONTENIDO -->

                <div class="p-5">


                    <h3 class="text-lg font-bold">

                    <span th:text="${work.title}">
                        Trabajo
                    </span>

                    </h3>


                    <p th:if="${work.description != null
                           and !work.description.isBlank()}"
                       th:text="${work.description}"
                       class="mt-2 line-clamp-3
                          text-sm text-slate-500">

                        Descripción

                    </p>


                    <!-- DOCUMENTOS -->

                    <div class="mt-5 flex
                            items-center
                            justify-between
                            border-t
                            border-slate-100
                            pt-4">

                    <span class="text-sm
                                 text-slate-500">

                        Documentos

                    </span>


                        <span class="rounded-full
                                 bg-slate-100
                                 px-3 py-1
                                 text-xs font-bold">

                        <span th:text="${#sets.size(work.documents)}">
                            0
                        </span>

                    </span>

                    </div>


                    <!-- DETALLE -->

                    <a th:href="@{/admin/works/{id}(id=${work.id})}"
                       class="mt-4 flex w-full
                          items-center
                          justify-center
                          rounded-lg
                          bg-slate-900
                          px-4 py-2.5
                          text-sm font-semibold
                          text-white
                          hover:bg-slate-800">

                        Ver trabajo →

                    </a>

                </div>

            </article>


            <!-- SIN TRABAJOS -->

            <div th:if="${#sets.isEmpty(week.works)}"
                 class="col-span-full
                    rounded-2xl
                    border border-dashed
                    border-slate-300
                    bg-white
                    px-6 py-16
                    text-center">


                <h3 class="text-lg font-bold">

                    No hay trabajos

                </h3>


                <p class="mt-2 text-sm
                      text-slate-500">

                    Esta semana todavía no tiene
                    trabajos registrados.

                </p>


                <a th:href="@{/admin/weeks/{id}/works/new(id=${week.id})}"
                   class="mt-6 inline-flex
                      rounded-lg
                      bg-sky-600
                      px-5 py-3
                      text-sm font-semibold
                      text-white
                      hover:bg-sky-700">

                    + Crear trabajo

                </a>

            </div>


        </div>

    </section>

</div>

</body>

</html>
