<!DOCTYPE html>

<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${week.id == null
                  ? 'Nueva semana'
                  : 'Editar semana'}">

        Semana

    </title>

    <link rel="stylesheet"
          th:href="@{/css/app.css}">

</head>

<body class="min-h-screen bg-slate-100 text-slate-900">

<div class="mx-auto max-w-3xl px-6 py-10">

    <!-- VOLVER -->

    <div class="mb-8">

        <a th:href="${week.id == null
                  ? '/admin'
                  : '/admin/weeks/' + week.id}"
           class="text-sm font-semibold
              text-slate-500
              hover:text-sky-600">

            ← Volver

        </a>

    </div>


    <!-- FORMULARIO -->

    <div class="rounded-2xl
            border border-slate-200
            bg-white
            p-6
            shadow-sm
            sm:p-8">


        <!-- TÍTULO -->

        <div class="mb-8">

            <p class="text-sm font-semibold
                  uppercase tracking-wider
                  text-sky-600">

                Administración

            </p>


            <h1 class="mt-1 text-3xl
                   font-bold">

            <span th:text="${week.id == null
                            ? 'Nueva semana'
                            : 'Editar semana'}">

                Nueva semana

            </span>

            </h1>


            <p class="mt-2 text-sm
                  text-slate-500">

                Completa la información de la semana.

            </p>

        </div>


        <!-- FORM -->

        <form th:action="${week.id == null
                       ? '/admin/weeks'
                       : '/admin/weeks/update/' + week.id}"
              th:object="${week}"
              method="post"
              class="space-y-6">


            <!-- NÚMERO -->

            <div>

                <label for="number"
                       class="mb-2 block
                          text-sm font-semibold">

                    Número de semana

                </label>


                <input type="number"
                       id="number"
                       th:field="*{number}"
                       min="1"
                       max="52"
                       required
                       placeholder="Ej. 1"
                       class="w-full rounded-lg
                          border border-slate-300
                          px-4 py-3
                          outline-none
                          transition
                          focus:border-sky-500
                          focus:ring-2
                          focus:ring-sky-100">

            </div>


            <!-- TÍTULO -->

            <div>

                <label for="title"
                       class="mb-2 block
                          text-sm font-semibold">

                    Título

                </label>


                <input type="text"
                       id="title"
                       th:field="*{title}"
                       maxlength="150"
                       required
                       placeholder="Ej. Introducción a Java"
                       class="w-full rounded-lg
                          border border-slate-300
                          px-4 py-3
                          outline-none
                          transition
                          focus:border-sky-500
                          focus:ring-2
                          focus:ring-sky-100">

            </div>


            <!-- DESCRIPCIÓN -->

            <div>

                <label for="description"
                       class="mb-2 block
                          text-sm font-semibold">

                    Descripción

                </label>


                <textarea id="description"
                          th:field="*{description}"
                          maxlength="500"
                          rows="5"
                          placeholder="Describe brevemente lo realizado durante esta semana..."
                          class="w-full resize-none
                             rounded-lg
                             border border-slate-300
                             px-4 py-3
                             outline-none
                             transition
                             focus:border-sky-500
                             focus:ring-2
                             focus:ring-sky-100"></textarea>

            </div>


            <!-- ACCIONES -->

            <div class="flex flex-col-reverse
                    gap-3
                    border-t
                    border-slate-100
                    pt-6
                    sm:flex-row
                    sm:justify-end">


                <a th:href="${week.id == null
                          ? '/admin'
                          : '/admin/weeks/' + week.id}"
                   class="inline-flex
                      items-center
                      justify-center
                      rounded-lg
                      border
                      border-slate-300
                      bg-white
                      px-5 py-3
                      text-sm font-semibold
                      text-slate-700
                      hover:bg-slate-50">

                    Cancelar

                </a>


                <button type="submit"
                        class="inline-flex
                           items-center
                           justify-center
                           rounded-lg
                           bg-sky-600
                           px-5 py-3
                           text-sm font-semibold
                           text-white
                           hover:bg-sky-700">

                <span th:text="${week.id == null
                                ? 'Crear semana'
                                : 'Guardar cambios'}">

                    Guardar

                </span>

                </button>

            </div>


        </form>


        <!-- ELIMINAR -->

        <div th:if="${week.id != null}"
             class="mt-8 border-t
                border-red-100
                pt-6">


            <h2 class="text-sm font-bold
                   text-red-700">

                Zona peligrosa

            </h2>


            <p class="mt-1 text-sm
                  text-slate-500">

                Eliminar una semana también eliminará
                sus trabajos y documentos asociados.

            </p>


            <form th:action="@{/admin/weeks/delete/{id}(id=${week.id})}"
                  method="post"
                  class="mt-4">

                <button type="submit"
                        onclick="return confirm(
                        '¿Estás seguro de eliminar esta semana? También se eliminarán sus trabajos y documentos.'
                    );"
                        class="rounded-lg
                           border border-red-200
                           bg-red-50
                           px-4 py-2.5
                           text-sm font-semibold
                           text-red-700
                           hover:bg-red-100">

                    Eliminar semana

                </button>

            </form>

        </div>


    </div>

</div>

</body>

</html>
